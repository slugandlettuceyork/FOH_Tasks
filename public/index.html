<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
<title>FOH Tasks — S&amp;L York</title>
<meta name="theme-color" content="#0F6E56" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="FOH Tasks" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F4EF;
  --surface:#FFFFFF;
  --surface-2:#F7F6F1;
  --surface-3:#EFEDE5;
  --border:#E4E1D6;
  --border-strong:#D3CFC0;
  --text:#1B211D;
  --muted:#7A796F;
  --muted-2:#9A9890;
  --teal:#0F6E56;
  --teal-light:#E1F5EE;
  --teal-dark:#085041;
  --gold:#B4790C;
  --gold-light:#FAEEDA;
  --red:#A32D2D;
  --red-light:#FCEBEB;
  --radius:14px;
  --safe-top: env(safe-area-inset-top, 0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',system-ui,sans-serif;
  min-height:100vh;
  padding-bottom:90px;
}
h1,h2,h3,.display{font-family:'Space Grotesk',system-ui,sans-serif;}
button{font-family:inherit;}
input,select,textarea{font-family:inherit;}

/* Header */
header.app-header{
  position:sticky; top:0; z-index:20;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  padding:calc(14px + var(--safe-top)) 18px 14px;
}
.header-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.brand{display:flex;flex-direction:column;gap:2px;}
.brand .title{font-size:1.15rem;font-weight:700;letter-spacing:0.2px;color:var(--text);}
.brand .subtitle{font-size:0.78rem;color:var(--muted);}
.week-badge{
  display:flex;flex-direction:column;align-items:flex-end;gap:2px;
}
.week-pill{
  font-size:0.72rem;font-weight:600;padding:3px 10px;border-radius:100px;
  background:var(--teal-light); color:var(--teal-dark); letter-spacing:0.3px;
}
.week-pill.even{background:var(--gold-light);color:#633806;}
.sync-row{display:flex;align-items:center;gap:6px;margin-top:2px;font-size:0.7rem;color:var(--muted-2);}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--teal);flex:none;}
.sync-dot.stale{background:var(--muted-2);}
.build-num{font-size:0.66rem;color:var(--muted-2);}
#syncNowBtn{
  background:none;border:1px solid var(--border-strong);color:var(--muted);
  border-radius:8px;padding:2px 8px;font-size:0.7rem;cursor:pointer;
}

/* Tabs */
nav.tabs{
  display:flex; gap:6px; padding:10px 14px 0;
  overflow-x:auto; scrollbar-width:none; background:var(--surface);
  border-bottom:1px solid var(--border);
}
nav.tabs::-webkit-scrollbar{display:none;}
.tab-btn{
  flex:none; background:none; border:none; color:var(--muted);
  padding:10px 14px; font-size:0.88rem; font-weight:600; cursor:pointer;
  border-bottom:2px solid transparent; white-space:nowrap;
}
.tab-btn.active{color:var(--text); border-bottom-color:var(--teal);}

main{max-width:720px; margin:0 auto; padding:16px 14px 40px;}
.view{display:none;}
.view.active{display:block;}

/* Day selector */
.day-strip{display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; margin-bottom:12px; scrollbar-width:none;}
.day-strip::-webkit-scrollbar{display:none;}
.day-chip{
  flex:none; padding:8px 14px; border-radius:100px; border:1px solid var(--border-strong);
  background:var(--surface); color:var(--muted); font-size:0.82rem; font-weight:600; cursor:pointer;
}
.day-chip.active{background:var(--teal); border-color:var(--teal); color:#fff;}
.day-chip.today::after{content:' •'; color:var(--gold);}

/* Section jump pills */
.section-pills{display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; margin-bottom:14px; scrollbar-width:none;}
.section-pills::-webkit-scrollbar{display:none;}
.section-pill{
  flex:none; padding:6px 12px; border-radius:100px; border:none;
  background:var(--surface-3); color:var(--muted); font-size:0.74rem; font-weight:600; cursor:pointer; white-space:nowrap;
}
.section-pill.complete{background:var(--teal-light); color:var(--teal-dark);}

.section-card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  margin-bottom:12px; overflow:hidden; scroll-margin-top:170px;
}
.section-card.complete{border-color:#C4E4D8; background:var(--teal-light);}
.section-head{
  display:flex; align-items:center; justify-content:space-between;
  padding:13px 16px; cursor:pointer; user-select:none;
}
.section-head h3{margin:0; font-size:0.95rem; font-weight:600; color:var(--text);}
.section-card.complete h3{color:var(--teal-dark);}
.section-head-right{display:flex; align-items:center; gap:8px;}
.section-progress{font-size:0.76rem; color:var(--muted);}
.section-card.complete .section-progress{color:var(--teal-dark);}
.chevron{width:16px;height:16px;flex:none;color:var(--muted-2);transition:transform 0.15s;}
.chevron.collapsed{transform:rotate(-90deg);}
.section-body{padding:0 12px 12px;}
.section-body.collapsed{display:none;}

.task-row{
  display:flex; align-items:center; gap:10px;
  padding:10px 8px; border-top:1px solid var(--border);
}
.task-row:first-child{border-top:none;}
.check{
  flex:none; width:26px; height:26px; border-radius:8px; border:2px solid var(--border-strong);
  display:flex; align-items:center; justify-content:center; cursor:pointer; background:var(--surface);
}
.check.done{background:var(--teal); border-color:var(--teal);}
.check svg{width:16px;height:16px;display:none;stroke:#fff;stroke-width:3;fill:none;}
.check.done svg{display:block;}
.task-text{flex:1; font-size:0.9rem; line-height:1.35; color:var(--text);}
.task-text.done{color:var(--muted); text-decoration:line-through;}
.initials-input{
  flex:none; width:72px; text-align:center; background:var(--surface-2);
  border:1px solid var(--border-strong); border-radius:8px; color:var(--text);
  padding:6px 4px; font-size:0.8rem; text-transform:uppercase;
}
.initials-input::placeholder{color:var(--muted-2); text-transform:none;}

.info-row{
  padding:9px 8px; border-top:1px solid var(--border); font-size:0.87rem; color:var(--muted);
}
.info-row:first-child{border-top:none;}
.info-row b{color:var(--text); font-weight:600;}

.meta-card{
  background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius);
  padding:14px 16px; margin-bottom:16px; display:flex; gap:16px; flex-wrap:wrap;
}
.meta-item{flex:1; min-width:110px;}
.meta-item label{display:block; font-size:0.68rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.4px; margin-bottom:3px;}
.meta-item input{
  width:100%; background:var(--surface); border:1px solid var(--border-strong); border-radius:8px;
  color:var(--text); padding:7px 8px; font-size:0.85rem;
}

/* Order sheet */
.order-table{width:100%; border-collapse:collapse; font-size:0.85rem;}
.order-table th{text-align:left; color:var(--muted); font-weight:600; font-size:0.72rem; text-transform:uppercase; padding:6px 6px; border-bottom:1px solid var(--border);}
.order-table td{padding:8px 6px; border-bottom:1px solid var(--border); vertical-align:middle;}
.order-table input{
  width:100%; background:var(--surface-2); border:1px solid var(--border-strong); border-radius:6px;
  color:var(--text); padding:5px 6px; font-size:0.82rem;
}
.order-clear-btn{
  margin-top:10px; background:none; border:1px solid var(--border-strong); color:var(--muted);
  border-radius:8px; padding:8px 12px; font-size:0.8rem; cursor:pointer;
}

/* Buttons / generic */
.btn{
  background:var(--teal); color:#fff; border:none; border-radius:10px;
  padding:11px 16px; font-size:0.88rem; font-weight:700; cursor:pointer;
}
.btn.secondary{background:var(--surface); color:var(--text); border:1px solid var(--border-strong);}
.btn.danger{background:var(--red); color:#fff;}
.btn.small{padding:7px 11px; font-size:0.78rem; border-radius:8px;}
.btn:disabled{opacity:0.5; cursor:default;}

/* Admin */
.pin-gate{max-width:280px; margin:60px auto; text-align:center;}
.pin-gate h2{margin-bottom:4px;}
.pin-gate p{color:var(--muted); font-size:0.85rem; margin-bottom:20px;}
.pin-dots{display:flex; gap:12px; justify-content:center; margin-bottom:20px;}
.pin-dot{width:14px; height:14px; border-radius:50%; border:2px solid var(--border-strong); background:transparent;}
.pin-dot.filled{background:var(--teal); border-color:var(--teal);}
.pin-pad{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; max-width:240px; margin:0 auto;}
.pin-key{
  background:var(--surface-2); border:1px solid var(--border-strong); color:var(--text);
  font-size:1.2rem; font-weight:600; border-radius:12px; padding:16px 0; cursor:pointer;
}
.pin-key.wide{grid-column:span 1;}
.pin-error{color:var(--red); font-size:0.82rem; height:18px; margin-top:6px;}

.admin-section{margin-bottom:26px;}
.admin-section h3{font-size:1rem; margin-bottom:10px;}
.admin-row{
  display:flex; align-items:center; gap:8px; background:var(--surface-2); border:1px solid var(--border);
  border-radius:10px; padding:8px 10px; margin-bottom:6px;
}
.admin-row input[type=text]{
  flex:1; background:var(--surface); border:1px solid var(--border-strong); border-radius:7px;
  color:var(--text); padding:7px 8px; font-size:0.83rem;
}
.admin-row .rm-btn{
  flex:none; background:none; border:none; color:var(--red); font-size:1.1rem; cursor:pointer; padding:4px 8px;
}
.select-row{display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap;}
.select-row select{
  background:var(--surface); border:1px solid var(--border-strong); color:var(--text);
  border-radius:8px; padding:8px 10px; font-size:0.85rem;
}
.subtle-input{
  background:var(--surface); border:1px solid var(--border-strong); color:var(--text);
  border-radius:8px; padding:8px 10px; font-size:0.85rem; width:100%;
}
.field-label{font-size:0.72rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.4px; margin:14px 0 5px;}
.toast{
  position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
  background:var(--text); border:1px solid var(--text); color:var(--surface);
  padding:10px 18px; border-radius:100px; font-size:0.82rem; z-index:100;
  opacity:0; pointer-events:none; transition:opacity 0.25s;
}
.toast.show{opacity:1;}
.empty-note{color:var(--muted); font-size:0.85rem; text-align:center; padding:30px 10px;}
</style>
</head>
<body>

<header class="app-header">
  <div class="header-row">
    <div class="brand">
      <div class="title">FOH Tasks</div>
      <div class="subtitle" id="dateLine">—</div>
    </div>
    <div class="week-badge">
      <div class="week-pill" id="weekPill">Week —</div>
      <div class="sync-row">
        <span class="sync-dot" id="syncDot"></span>
        <span id="syncLabel">syncing…</span>
        <button id="syncNowBtn">⟳ Sync</button>
      </div>
      <div class="build-num" id="buildNum">—</div>
    </div>
  </div>
</header>

<nav class="tabs">
  <button class="tab-btn active" data-view="today">Today's Tasks</button>
  <button class="tab-btn" data-view="order">Order Sheet</button>
  <button class="tab-btn" data-view="admin">Admin</button>
</nav>

<main>

  <section id="view-today" class="view active">
    <div class="day-strip" id="dayStrip"></div>
    <div class="section-pills" id="sectionPills"></div>
    <div class="meta-card">
      <div class="meta-item"><label>Sales Target</label><input type="text" id="salesTarget" placeholder="£"></div>
      <div class="meta-item"><label>AM Manager</label><input type="text" id="amManager" placeholder="Initials"></div>
      <div class="meta-item"><label>PM Manager</label><input type="text" id="pmManager" placeholder="Initials"></div>
    </div>
    <div id="todaySections"></div>
  </section>

  <section id="view-order" class="view">
    <p style="color:var(--muted);font-size:0.85rem;margin-top:0;">Par levels are set by admin. Fill in what needs ordering before the weekly Global Order.</p>
    <table class="order-table">
      <thead><tr><th>Product</th><th>Pack</th><th>Par</th><th>Need to order</th></tr></thead>
      <tbody id="orderTableBody"></tbody>
    </table>
    <button class="order-clear-btn" id="clearOrderBtn">Clear all "need to order" amounts</button>
  </section>

  <section id="view-admin" class="view">
    <div id="pinGateWrap"></div>
    <div id="adminPanel" style="display:none;"></div>
  </section>

</main>
